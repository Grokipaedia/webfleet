name: WebFleet Scan

on:
  schedule:
    # Every 6 hours. GitHub Actions cron can lag under load — treat this
    # as "roughly every 6 hours," not a precise guarantee.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}  # lets you trigger a scan manually from the Actions tab

permissions:
  contents: write  # needed to commit results.json back to the repo
  issues: write    # needed for the alert issue (create/update/close) — see scan.py's sync_github_alert_issue()

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scan
        run: python3 scan.py
        env:
          # GITHUB_TOKEN is auto-provided by every Action run — not a
          # secret you create, just needs to be explicitly passed into
          # the step's environment to be readable by scan.py. Used only
          # to create/update/close the single tracking issue for
          # confirmed critical findings (see sync_github_alert_issue()).
          # GITHUB_REPOSITORY is also auto-provided, no wiring needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Application Password credentials for authenticated WordPress
          # checks (plugin/theme update detection). Only sites listed
          # with a "wp_secret_key" in sites.json use these — everything
          # else runs exactly as before, no credentials involved. Never
          # printed or logged anywhere in scan.py; verified directly
          # during development that no output path exposes these values.
          CMG: ${{ secrets.CMG }}
          WP_APP_PASSWORD_CMG: ${{ secrets.WP_APP_PASSWORD_CMG }}
          IBOUND: ${{ secrets.IBOUND }}
          WP_APP_PASSWORD_IBOUND: ${{ secrets.WP_APP_PASSWORD_IBOUND }}
          AIPAY: ${{ secrets.AIPAY }}
          WP_APP_PASSWORD_AIPAY: ${{ secrets.WP_APP_PASSWORD_AIPAY }}

      - name: Commit results if changed
        run: |
          git config user.name "webfleet-bot"
          git config user.email "actions@github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Automated scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
